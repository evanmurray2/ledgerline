<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Ledgerline</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Add to Home Screen opens it as its own app, with this icon, not a Safari tab. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ledgerline" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The status bar: --ll-surface in src/styles.css, light then dark. src/lib/theme.ts reads both. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181b21" media="(prefers-color-scheme: dark)" />
  </head>
