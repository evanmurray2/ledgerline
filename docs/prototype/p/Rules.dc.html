<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}

</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--cF5F6F8, #F5F6F8); font-family: 'Public Sans', system-ui, sans-serif; color: var(--c111827, #111827); overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 4px; background: var(--cFFFFFF, #FFFFFF); border-bottom: 1px solid var(--cE5E7EB, #E5E7EB)">
<div style="display: flex; align-items: center; gap: 4px">
<a href="Settings.dc.html" aria-label="Back to settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--c374151, #374151)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 19px; font-weight: 700">Rules</h1>
</div>
<a class="hit" href="Rule.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 12px; color: {{accent}}; text-decoration: none; font-size: 14px; font-weight: 700">+ New rule</a>
</header>
<main style="flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 13px; color: var(--c4B5563, #4B5563); line-height: 1.4">Rules run top to bottom on each new transaction; the first match wins. They never change a category you set yourself.</p>
<div style="background: var(--cFFFFFF, #FFFFFF); border: 1px solid var(--cE5E7EB, #E5E7EB); border-radius: 14px; overflow: hidden; flex-shrink: 0">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="6">
<a href="Rule.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 6px 12px; border-top: 1px solid var(--cF0F1F3, #F0F1F3); text-decoration: none; color: var(--c111827, #111827)">
<span aria-hidden="true" style="width: 24px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--c98A2B3, #98A2B3); text-align: right">{{r.n}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 600">{{r.when}}</span><span style="font-size: 13px; color: var(--c374151, #374151)">→ {{r.then}}</span><span style="font-size: 12px; color: var(--c4B5563, #4B5563)">{{r.meta}}</span></span>
<span aria-hidden="true" style="font-size: 18px; color: var(--c98A2B3, #98A2B3)">›</span>
</a>
</sc-for>
</div>
<span style="font-size: 12px; color: var(--c4B5563, #4B5563)">To make a rule quickly, categorize a payee the same way twice; Activity will offer “Always”.</span>
</main>
<dc-import name="TabBar" active="accounts" accent="{{accent}}" hint-size="390px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["app","light","dark"],"default":"app"},"accent":{"editor":"color","default":"#1D4ED8","options":["#1D4ED8","#0F766E","#6D28D9","#111827"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  llGetPref() { try { return localStorage.getItem('ledgerline-theme') || this.llMem || 'device'; } catch (e) { return this.llMem || 'device'; } }
  llSetPref(v) { this.llMem = v; try { localStorage.setItem('ledgerline-theme', v); } catch (e) {} this.llApply(); }
  llApply() {
    const forced = this.props.theme && this.props.theme !== 'app' ? this.props.theme : null;
    const p = forced || this.llGetPref();
    let dark = p === 'dark';
    if (p === 'device') { try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {} }
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const acc = { '#1D4ED8': '#8AB4FF', '#0F766E': '#5EEAD4', '#6D28D9': '#C4B5FD', '#111827': '#F2F4F7' };
    const a = String(this.props.accent || 'var(--c1D4ED8, #1D4ED8)').toUpperCase();
    if (a.charAt(0) === '#') { try { document.documentElement.style.setProperty('--accent', dark ? (acc[a] || '#8AB4FF') : a); } catch (e) {} }
  }
  componentDidMount() {
    this.llApply();
    this.llOn = () => { this.llApply(); this.forceUpdate(); };
    try { window.addEventListener('storage', this.llOn); this.llMq = window.matchMedia('(prefers-color-scheme: dark)'); this.llMq.addEventListener('change', this.llOn); } catch (e) {}
  }
  componentDidUpdate() { this.llApply(); }
  componentWillUnmount() { try { window.removeEventListener('storage', this.llOn); this.llMq.removeEventListener('change', this.llOn); } catch (e) {} }

  renderVals() {
    const r = (n, when, then, meta) => ({ n: n, when: when, then: then, meta: meta });
    return {
      accent: ('var(--accent, ' + (this.props.accent ?? 'var(--c1D4ED8, #1D4ED8)') + ')'),
      rules: [
        r(1, 'Payee is Rent (Zelle to Bay Prop Mgmt)', 'Rent · $2,000 owed to you · count in previous month if day 1–5', 'Used 3 times'),
        r(2, 'Payee is Acme Corp payroll', 'Ready to Assign', 'Used 6 times'),
        r(3, 'Payee is Trader Joe’s', 'Groceries', 'Used 14 times · last today'),
        r(4, 'Payee is Comcast', 'Internet', 'Used 2 times'),
        r(5, 'Payee is PG&E', 'Electric', 'Used 2 times'),
        r(6, 'Payee is Shell or Chevron', 'Gas', 'Used 5 times'),
        r(7, 'Description contains “VANGUARD”', 'Investments', 'Used 2 times'),
        r(8, 'Payee is Uber Eats, amount under $60', 'Dining out', 'Used 4 times'),
        r(9, 'Payee is Netflix or Spotify', 'Subscriptions', 'Used 4 times'),
        r(10, 'Payee is Safeway or Whole Foods', 'Groceries', 'Used 7 times'),
        r(11, 'Payee is Blue Bottle Coffee', 'Dining out', 'Made from Activity today'),
        r(12, 'Account is Freedom, description has “REWARDS”', 'Rewards (to card payment)', 'Used 1 time')
      ]
    };
  }
}
</script>
</body>
</html>
