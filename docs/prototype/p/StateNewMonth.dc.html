<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledgerline new month</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent, #1D4ED8)}a:hover{color:var(--c1E3A8A, #1E3A8A)}
.hit{position:relative}.hit::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}:root[data-theme="dark"]{--cFFFFFF:#181B21;--cF5F6F8:#0E1014;--cF9FAFB:#1D2128;--cF2F4F7:#252A32;--cF0F1F3:#262B33;--cE5E7EB:#2C323B;--cE4E7EC:#333A44;--cEEF0F3:#2A2F37;--cE9EBEF:#252A32;--cD0D5DD:#4A525E;--c98A2B3:#7C8695;--c667085:#949DAB;--c5B6170:#05060A;--c4B5563:#A7AFBB;--c374151:#D0D5DD;--c344054:#D0D5DD;--c111827:#F2F4F7;--c1D4ED8:#8AB4FF;--c1E3A8A:#B9D1FF;--c085D3A:#6CE9A6;--cECFDF3:#10291D;--cDCFAE6:#12301F;--cABEFC6:#1F5135;--c12B76A:#32D583;--cB42318:#F97066;--cFEE4E2:#3A1614;--cD92D20:#F04438;--c93370D:#FDB022;--c7A2E0E:#FEC84B;--cFEF0C7:#3A2A0A;--cFFFAEB:#2B2108;--cFEDF89:#5C4410;--cF79009:#F79009;--c6941C6:#BDB4FE;--cF4EBFF:#2A1F45;--c9E77ED:#9E77ED;--c3538CD:#A4BCFD;--cEEF4FF:#1C2547;--cEEF2FF:#1C2547;--c175CD3:#84CAFF;--cD1E9FF:#102A45;--c2E90FA:#53B1FD;--c026AA2:#7CD4FD;--cE0F2FE:#0B2A3D;--c0F766E:#5EEAD4;--c6D28D9:#C4B5FD;--accent:#8AB4FF;color-scheme:dark}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cFFFFFF:#181B21;--cF5F6F8:#0E1014;--cF9FAFB:#1D2128;--cF2F4F7:#252A32;--cF0F1F3:#262B33;--cE5E7EB:#2C323B;--cE4E7EC:#333A44;--cEEF0F3:#2A2F37;--cE9EBEF:#252A32;--cD0D5DD:#4A525E;--c98A2B3:#7C8695;--c667085:#949DAB;--c5B6170:#05060A;--c4B5563:#A7AFBB;--c374151:#D0D5DD;--c344054:#D0D5DD;--c111827:#F2F4F7;--c1D4ED8:#8AB4FF;--c1E3A8A:#B9D1FF;--c085D3A:#6CE9A6;--cECFDF3:#10291D;--cDCFAE6:#12301F;--cABEFC6:#1F5135;--c12B76A:#32D583;--cB42318:#F97066;--cFEE4E2:#3A1614;--cD92D20:#F04438;--c93370D:#FDB022;--c7A2E0E:#FEC84B;--cFEF0C7:#3A2A0A;--cFFFAEB:#2B2108;--cFEDF89:#5C4410;--cF79009:#F79009;--c6941C6:#BDB4FE;--cF4EBFF:#2A1F45;--c9E77ED:#9E77ED;--c3538CD:#A4BCFD;--cEEF4FF:#1C2547;--cEEF2FF:#1C2547;--c175CD3:#84CAFF;--cD1E9FF:#102A45;--c2E90FA:#53B1FD;--c026AA2:#7CD4FD;--cE0F2FE:#0B2A3D;--c0F766E:#5EEAD4;--c6D28D9:#C4B5FD;--accent:#8AB4FF;color-scheme:dark}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--cF5F6F8, #F5F6F8); font-family: 'Public Sans', system-ui, sans-serif; color: var(--c111827, #111827); overflow: hidden">
<header style="display: flex; align-items: center; justify-content: center; height: 56px; background: var(--cFFFFFF, #FFFFFF); border-bottom: 1px solid var(--cE5E7EB, #E5E7EB)"><h1 style="margin: 0; font-size: 17px; font-weight: 700">December 2026</h1></header>
<main style="flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
<section style="background: var(--cFFFFFF, #FFFFFF); border: 1px solid var(--cE5E7EB, #E5E7EB); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">December has started</h2>
<span style="font-size: 13px; color: var(--c4B5563, #4B5563); line-height: 1.45">Nothing moved on its own. Here’s what carried over from November.</span>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; border-top: 1px solid var(--cF0F1F3, #F0F1F3); font-size: 14px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{l.k}}</span><span style="font-size: 12px; color: var(--c4B5563, #4B5563)">{{l.note}}</span></span><span style="font-weight: 700; font-variant-numeric: tabular-nums; color: {{l.ink}}">{{l.v}}</span></div>
</sc-for>
</section>
<section style="background: var(--cFFFFFF, #FFFFFF); border: 1px solid var(--cE5E7EB, #E5E7EB); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 15px; font-weight: 700">Targets for December</h2><span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{need}}</span></div>
<span style="font-size: 13px; color: var(--c4B5563, #4B5563); line-height: 1.45">{{needText}}</span>
<button onClick="{{fill}}" style="height: 48px; border-radius: 12px; border: none; background: {{fillBg}}; color: {{fillFg}}; font-family: inherit; font-size: 15px; font-weight: 700">{{fillCta}}</button>
</section>
</main>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: {{accent}}; color: var(--cFFFFFF, #FFFFFF)">
<div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; font-weight: 600">Ready to Assign</span><span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">{{rta}}</span></div>
<a class="hit" href="Assign.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 22px; border-radius: 999px; background: var(--cFFFFFF, #FFFFFF); color: {{accent}}; text-decoration: none; font-size: 15px; font-weight: 700">Assign</a>
</div>
<dc-import name="TabBar" active="budget" accent="{{accent}}" hint-size="390px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["app","light","dark"],"default":"app"},"accent":{"editor":"color","default":"#1D4ED8","options":["#1D4ED8","#0F766E","#6D28D9","#111827"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  llGetPref() { try { return localStorage.getItem('ledgerline-theme') || this.llMem || 'device'; } catch (e) { return this.llMem || 'device'; } }
  llSetPref(v) { this.llMem = v; try { localStorage.setItem('ledgerline-theme', v); } catch (e) {} this.llApply(); }
  llApply() {
    const forced = this.props.theme && this.props.theme !== 'app' ? this.props.theme : null;
    const p = forced || this.llGetPref();
    let dark = p === 'dark';
    if (p === 'device') { try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {} }
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const acc = { '#1D4ED8': '#8AB4FF', '#0F766E': '#5EEAD4', '#6D28D9': '#C4B5FD', '#111827': '#F2F4F7' };
    const a = String(this.props.accent || 'var(--c1D4ED8, #1D4ED8)').toUpperCase();
    if (a.charAt(0) === '#') { try { document.documentElement.style.setProperty('--accent', dark ? (acc[a] || '#8AB4FF') : a); } catch (e) {} }
  }
  componentDidMount() {
    this.llApply();
    this.llOn = () => { this.llApply(); this.forceUpdate(); };
    try { window.addEventListener('storage', this.llOn); this.llMq = window.matchMedia('(prefers-color-scheme: dark)'); this.llMq.addEventListener('change', this.llOn); } catch (e) {}
  }
  componentDidUpdate() { this.llApply(); }
  componentWillUnmount() { try { window.removeEventListener('storage', this.llOn); this.llMq.removeEventListener('change', this.llOn); } catch (e) {} }

  constructor(props) {
    super(props);
    this.state = { filled: false };
  }
  renderVals() {
    const accent = ('var(--accent, ' + (this.props.accent ?? 'var(--c1D4ED8, #1D4ED8)') + ')');
    const f = this.state.filled;
    return {
      accent: accent,
      lines: [
        { k: 'Ready to Assign', note: 'November’s $643.65 left + $1,018 Venmo payback − $2,000 rent fronted for Sam on Nov 30 + $3,100 Dec 1 paycheck', v: '$2,761.65', ink: 'var(--c111827, #111827)' },
        { k: 'Category balances', note: 'Every category keeps what it had left', v: 'kept', ink: 'var(--c085D3A, #085D3A)' },
        { k: 'Overspending', note: 'Dining out was covered in November, so none carries', v: '$0.00', ink: 'var(--c111827, #111827)' },
        { k: 'Owed to you', note: 'Sam’s December rent and United · each comes back to Ready to Assign when paid', v: '$2,412.60 out', ink: 'var(--c111827, #111827)' }
      ],
      need: '$2,640.00',
      needText: f ? 'Filled every refill target and this month’s share of each savings goal.' : 'Refill targets (Rent, Groceries, Dining out and the rest) plus this month’s share of Car insurance and Vacation.',
      fillCta: f ? 'Undo' : 'Fill targets · $2,640.00',
      fillBg: f ? 'var(--cF2F4F7, #F2F4F7)' : accent, fillFg: f ? 'var(--c374151, #374151)' : 'var(--cFFFFFF, #FFFFFF)',
      fill: () => this.setState({ filled: !f }),
      rta: f ? '$121.65' : '$2,761.65'
    };
  }
}
</script>
</body>
</html>
