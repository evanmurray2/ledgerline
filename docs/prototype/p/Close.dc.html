      else if (c.overTarget) det = c.t === 'overfunded' ? fmt(-c.fix) + ' more than this month’s ' + fmt(c.target) : 'back to this month’s target';

      united: { name: 'United', title: 'United Airlines · $412.60 owed', sub: 'Oct 20 · work trip · expected by Dec 4', amt: '$412.60', cat: 'Vacation', month: 'October', full: '$412.60', back: 'nothing was paid back yet', due: 'Dec 4' }
    };
    const it = items[this.state.item];
    const defs = [
      { id: 'close', name: 'They won’t pay it', desc: 'It becomes your spending: ' + it.cat + ' is charged ' + it.amt + ' in November, and Ready to Assign gets back the ' + it.amt + ' it fronted. If that overspends ' + it.cat + ', Needs attention will offer to cover it.', cta: 'Close out ' + it.amt, result: 'Closed. ' + it.cat + ' was charged ' + it.amt + ' in November and Ready to Assign got ' + it.amt + ' back.' },
      { id: 'cancel', name: 'I marked it by mistake', desc: 'Remove the mark. ' + it.cat + ' is charged the full ' + it.full + ' in ' + it.month + ', Ready to Assign gets the fronted amount back, and ' + it.back + '.', cta: 'Remove the mark', result: 'Mark removed. ' + it.cat + ' in ' + it.month + ' now carries the full ' + it.full + '.' },
      { id: 'wait', name: 'Give it more time', desc: 'Keep it open with a new date (now ' + it.due + '), so it doesn’t show as late.', cta: 'Save new date', result: 'Still open, now expected by Nov 30.' }
    ];
    const pick = this.state.pick;
    const cur = defs.find((d) => d.id === pick);
    return {
      accent: accent,
      title: it.title, sub: it.sub,
      items: Object.keys(items).filter((k) => !this.llModel().paid[k]).map((k) => ({ name: items[k].name, pressed: k === this.state.item ? 'true' : 'false', bg: k === this.state.item ? 'var(--cFFFFFF, #FFFFFF)' : 'transparent', pick: () => this.setState({ item: k, done: false }) })),
      choosing: !this.state.done,
      doneState: this.state.done,
      isWait: pick === 'wait',
      cta: cur.cta,
      result: cur.result,
      confirm: () => { const D = this.llDemo(); const it = this.state.item; const key = { close: 'closed', cancel: 'canceled', wait: 'snoozed' }[this.state.pick]; this.llSaveDemo({ [key]: Object.assign({}, D[key] || {}, { [it]: true }) }); this.setState({ done: true }); },
      undo: () => { const D = this.llDemo(); const it = this.state.item; const p = {}; ['closed', 'canceled', 'snoozed'].forEach((k) => { const o = Object.assign({}, D[k] || {}); delete o[it]; p[k] = o; }); this.llSaveDemo(p); this.setState({ done: false }); },
      opts: defs.map((d) => {
        const on = d.id === pick;
        return { name: d.name, desc: d.desc, pressed: on ? 'true' : 'false', border: on ? accent : 'var(--cD0D5DD, #D0D5DD)', bg: on ? 'var(--cEEF2FF, #EEF2FF)' : 'var(--cFFFFFF, #FFFFFF)', dot: on ? accent : 'transparent', pick: () => this.setState({ pick: d.id }) };
      })
    };
  }
}
</script>
