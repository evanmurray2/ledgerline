<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["app","light","dark"],"default":"app"},"accent":{"editor":"color","default":"#1D4ED8","options":["#1D4ED8","#0F766E","#6D28D9","#111827"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  llGetPref() { try { return localStorage.getItem('ledgerline-theme') || this.llMem || 'device'; } catch (e) { return this.llMem || 'device'; } }
  llSetPref(v) { this.llMem = v; try { localStorage.setItem('ledgerline-theme', v); } catch (e) {} this.llApply(); }
  llApply() {
    const forced = this.props.theme && this.props.theme !== 'app' ? this.props.theme : null;
    const p = forced || this.llGetPref();
    let dark = p === 'dark';
    if (p === 'device') { try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {} }
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const acc = { '#1D4ED8': '#8AB4FF', '#0F766E': '#5EEAD4', '#6D28D9': '#C4B5FD', '#111827': '#F2F4F7' };
    const a = String(this.props.accent || 'var(--c1D4ED8, #1D4ED8)').toUpperCase();
    if (a.charAt(0) === '#') { try { document.documentElement.style.setProperty('--accent', dark ? (acc[a] || '#8AB4FF') : a); } catch (e) {} }
  }
  componentDidMount() {
    this.llApply();
    this.llOn = () => { this.llApply(); this.forceUpdate(); };
    try { window.addEventListener('storage', this.llOn); this.llMq = window.matchMedia('(prefers-color-scheme: dark)'); this.llMq.addEventListener('change', this.llOn); } catch (e) {}
  }
  componentDidUpdate() { this.llApply(); }
  componentWillUnmount() { try { window.removeEventListener('storage', this.llOn); this.llMq.removeEventListener('change', this.llOn); } catch (e) {} }

  llDemo() { try { const v = localStorage.getItem('ledgerline-demo'); if (v) return JSON.parse(v); } catch (e) {} return this.llDemoMem || {}; }
  llSaveDemo(patch) { const d = Object.assign({}, this.llDemo(), patch); this.llDemoMem = d; try { localStorage.setItem('ledgerline-demo', JSON.stringify(d)); } catch (e) {} this.setState({ llTick: Date.now() }); }
  llModel() {
    const d = this.llDemo();
    const done = d.done || {}, closed = d.closed || {}, canceled = d.canceled || {}, snoozed = d.snoozed || {}, cleared = d.cleared || {}, cats = d.cats || {}, custom = d.custom || {};
    const fmt = (c) => (c < 0 ? '−$' : '$') + (Math.abs(c) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const paid = d.venmo === 'matched' ? (d.paidIds || { rent: true, nopa: true }) : {};
    const owed = { rent: 100000 + (d.zelleUnlinked ? 100000 : 0), nopa: 1800, united: 41260 };
    const owedCat = { rent: 'rent', nopa: 'dining', united: 'vacation' };
    const settled = (k) => !!(paid[k] || closed[k] || canceled[k]);
    const chargedNow = (k) => !paid[k] && (closed[k] || (canceled[k] && k !== 'rent'));
    // base categories (cents): avail, assigned, spent this month
    const B = [
      ['rent', 'Rent', 'bills', 100000, 100000, 0, { bill: true, target: 100000, detail: 'your $1,000 of $3,000 · Nov 30', tgt: 'Refill to $1,000 every month' }],
      ['electric', 'Electric', 'bills', 4130, 9500, 5370, { bill: true, target: 9500, tgt: 'Refill to $95 every month' }],
      ['internet', 'Internet', 'bills', 8000, 8000, 0, { bill: true, target: 8000, detail: 'Comcast $79.99 on Nov 16', tgt: 'Refill to $80 every month' }],
      ['subs', 'Subscriptions', 'bills', 55, 6500, 6445, { bill: true, target: 6500, tgt: 'Refill to $65 every month' }],
      ['groceries', 'Groceries', 'everyday', 21240, 60000, 38760, { target: 60000, tgt: 'Refill to $600 every month' }],
      ['dining', 'Dining out', 'everyday', -1825, 20000, 21825, { target: 20000, tgt: 'Refill to $200 every month', overNote: 'Shake Shack on Freedom overspent it' }],
      ['gas', 'Gas', 'everyday', 6410, 12000, 5590, { target: 12000, tgt: 'Refill to $120 every month' }],
      ['shopping', 'Shopping', 'everyday', 5320, 20000, 14680, { target: 20000, tgt: 'Refill to $200 every month' }],
      ['household', 'Household', 'everyday', 4000, 10000, 9155, { target: 10000, tgt: 'Refill to $100 every month', carry: '$31.55 carried from October' }],
      ['health', 'Health', 'everyday', 7500, 7500, 0, { target: 7500, tgt: 'Refill to $75 every month' }],
      ['personal', 'Personal care', 'everyday', 1500, 10000, 8500, { target: 10000, tgt: 'Refill to $100 every month' }],
      ['invest', 'Investments', 'savings', 0, 150000, 150000, { invest: true, detail: '$1,500 to Vanguard on Nov 1', tgt: 'Invest $1,500 every month' }],
      ['car', 'Car insurance', 'savings', 36000, 0, 0, { need: 9000, goal: '$540 by Jan 15', tgt: '$540 by Jan 15, every 6 months' }],
      ['vacation', 'Vacation', 'savings', 125000, 0, 0, { need: 25000, goal: '$3,000 by Jun 2027', tgt: '$3,000 by Jun 2027 (funded by the start of June)' }],
      ['gifts', 'Gifts', 'savings', 21000, 17000, 21600, { target: 17000, overTarget: true, tgt: 'Refill to $170 every month' }],
      ['emergency', 'Emergency fund', 'savings', 1500000, 0, 0, { reached: true, detail: 'goal $15,000 reached', tgt: '$15,000 by Dec 2026' }],
      ['home', 'Home repairs', 'savings', 205763, 0, 0, { none: true, detail: 'kept for repairs', tgt: 'No target' }]
    ];
    const C = {};
    const order = [];
    B.forEach((b) => { C[b[0]] = Object.assign({ id: b[0], name: b[1], group: b[2], avail: b[3], assigned: b[4], spent: b[5] }, b[6]); order.push(b[0]); });
    if (d.checkDeleted) { C.gifts.avail += 12000; C.gifts.spent -= 12000; }
    Object.keys(owed).forEach((k) => { if (chargedNow(k)) { const c = C[owedCat[k]]; c.avail -= owed[k]; c.spent += owed[k]; c.charged = (c.charged || 0) + owed[k]; } });
    Object.keys(custom).forEach((k) => { if (C[k]) { C[k].avail += custom[k]; C[k].assigned += custom[k]; } });
    Object.keys(done).forEach((k) => { if (C[k]) { C[k].avail += done[k]; C[k].assigned += done[k]; } });
    // categorizing uncategorized card spending, in date order
    const U = [['a2', 'freedom', 2320], ['cvs', 'freedom', 1843], ['a1', 'sapphire', 3810], ['bb', 'sapphire', 675]];
    const byName = {};
    order.forEach((k) => { byName[C[k].name] = k; });
    const cardFund = { sapphire: 0, freedom: 0 }, waits = { sapphire: 0, freedom: 0 };
    U.forEach((u) => {
      const k = cats[u[0]] ? byName[cats[u[0]]] : null;
      if (!k) { waits[u[1]] += u[2]; return; }
      const before = C[k].avail;
      cardFund[u[1]] += Math.max(0, Math.min(before, u[2]));
      C[k].avail -= u[2]; C[k].spent += u[2];
    });
    // card payment categories (cents)
    const diningCover = done.dining || 0;
    const cards = {
      sapphire: { name: 'Sapphire Preferred', pay: 87832 + cardFund.sapphire, need: 92317 - waits.sapphire, stmt: 'statement $611.40 due Nov 25', waits: waits.sapphire, href: 'Register.dc.html' },
      freedom: { name: 'Freedom Unlimited', pay: 15500 + Math.min(diningCover, 1825) + cardFund.freedom, need: 21488 - waits.freedom, stmt: 'statement $145.15 due Dec 2', waits: waits.freedom, href: 'RegisterFreedom.dc.html' }
    };
    // Ready to Assign
    let rta = 98190 + (d.zelleUnlinked ? -100000 : 0);
    Object.keys(done).forEach((k) => { rta -= done[k]; });
    Object.keys(custom).forEach((k) => { rta -= custom[k]; });
    if (d.venmo) rta += (d.venmoIn === undefined ? 101800 : d.venmoIn);
    if (d.xferPick) rta += d.xferPick === 'none' ? 40000 : 20000;
    Object.keys(owed).forEach((k) => { if (chargedNow(k)) rta += owed[k]; });
    let out = 0;
    Object.keys(owed).forEach((k) => { if (!settled(k)) out += owed[k]; });
    const nopaLate = !settled('nopa') && !snoozed.nopa;
    // statuses
    order.forEach((k) => {
      const c = C[k];
      if (c.avail < 0) { c.t = 'over'; c.fix = -c.avail; c.fixVerb = 'Cover'; return; }
      if (c.invest) { c.t = 'invested'; return; }
      if (c.none) { c.t = 'none'; return; }
      if (c.reached) { c.t = 'funded'; return; }
      if (c.need) { const left = c.need - (done[k] || 0); if (left > 0) { c.t = 'under'; c.fix = left; c.fixVerb = 'Fund'; } else c.t = 'funded'; return; }
      if (k === 'rent' && c.avail < 100000) { c.t = 'under'; c.fix = 100000 - c.avail; c.fixVerb = 'Fund'; return; }
      if (c.overTarget && c.avail > c.target) { c.t = 'overfunded'; c.fix = -(c.avail - c.target); c.fixVerb = 'Move'; return; }
      if (!c.bill && c.target) {
        const pace = c.spent / Math.max(1, c.spent + c.avail) - 0.47;
        if (c.avail < 0.2 * c.target || pace > 0.30) { c.t = 'low'; c.fix = Math.max(100, Math.ceil((0.35 * c.target - c.avail) / 100) * 100); c.fixVerb = 'Add'; return; }
      }
      c.t = 'funded';
    });
    order.forEach((k) => {
      const c = C[k];
      let det = c.detail || '';
      if (c.t === 'over') det = c.charged ? 'charged ' + fmt(c.charged) + ' after a close-out · overspent' : (c.overNote || 'overspent');
      else if (k === 'rent' && c.t === 'under') det = 'charged $1,000 for Sam’s unpaid share · needs $1,000 by Nov 30';
      else if (c.need) det = (c.charged ? 'charged ' + fmt(c.charged) + ' after a close-out · ' : '') + (c.t === 'under' ? 'needs ' + fmt(c.fix) + ' this month · ' + c.goal : 'this month’s share is in · ' + c.goal);
      else if (c.overTarget) det = c.t === 'overfunded' ? fmt(-c.fix) + ' more than this month’s ' + fmt(c.target) : 'back to this month’s target';
      else if (c.target && !det) det = fmt(c.spent) + ' of ' + fmt(c.target) + ' spent' + (c.t === 'low' ? ' · ' + fmt(c.avail) + ' left' : '') + (c.carry ? ' · ' + c.carry : '');
      if (c.bill && k === 'subs') det = fmt(c.spent) + ' of ' + fmt(c.target) + ' spent · bills are never Low';
      if (done[k] && c.t === 'funded') det = det + ' · added ' + fmt(done[k]);
      c.detailText = det;
    });
    // projected shortfall from the Nov 30 rent front
    const rentRule = !d.zelleUnlinked || true;
    const front = 200000;
    const shortBy = rentRule && rta < front ? front - rta : 0;
    // attention list
    const attn = [];
    const secOf = { over: 'Overspent', under: 'Underfunded', low: 'Low', overfunded: 'Overfunded' };
    order.forEach((k) => {
      const c = C[k];
      if (secOf[c.t]) attn.push({ sec: secOf[c.t], id: k, name: c.name, avail: c.avail, detail: c.detailText, fix: c.fix, action: c.fixVerb + ' ' + fmt(Math.abs(c.fix)) });
      else if (done[k]) attn.push({ sec: 'Done', id: k, name: c.name, avail: c.avail, detail: (done[k] < 0 ? 'Moved ' + fmt(-done[k]) + ' back to' : 'Added ' + fmt(done[k]) + ' from') + ' Ready to Assign', doneItem: true });
    });
    if (nopaLate) attn.push({ sec: 'Owed to you', id: 'nopa-late', name: 'Nopa · Alex', availText: '$18.00', detail: 'Late: expected back by Nov 10', link: 'Owed.dc.html', action: 'Review' });
    if (shortBy > 0) attn.push({ sec: 'Owed to you', id: 'rent-front', name: 'Rent on Nov 30', availText: fmt(-shortBy), detail: 'Fronts $2,000 for Sam. Ready to Assign has ' + fmt(rta) + ', so it would go ' + fmt(rta - front) + (d.venmo ? '.' : '. Matching the Venmo money adds $1,018.'), link: 'Owed.dc.html', action: 'Review' });
    if (rta < 0) attn.push({ sec: 'Ready to Assign', id: 'rta-neg', name: 'Ready to Assign', availText: fmt(rta), detail: 'More is assigned than you have. Take it back from a category.', link: 'Category.dc.html', action: 'Move money' });
    const open = attn.filter((a) => !a.doneItem).length;
    const waitingLeft = d.venmo ? (d.venmoLeft || 0) : 101800;
