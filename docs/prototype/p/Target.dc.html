<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledgerline edit target</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent, #1D4ED8)}a:hover{color:var(--c1E3A8A, #1E3A8A)}
.hit{position:relative}.hit::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}:root[data-theme="dark"]{--cFFFFFF:#181B21;--cF5F6F8:#0E1014;--cF9FAFB:#1D2128;--cF2F4F7:#252A32;--cF0F1F3:#262B33;--cE5E7EB:#2C323B;--cE4E7EC:#333A44;--cEEF0F3:#2A2F37;--cE9EBEF:#252A32;--cD0D5DD:#4A525E;--c98A2B3:#7C8695;--c667085:#949DAB;--c5B6170:#05060A;--c4B5563:#A7AFBB;--c374151:#D0D5DD;--c344054:#D0D5DD;--c111827:#F2F4F7;--c1D4ED8:#8AB4FF;--c1E3A8A:#B9D1FF;--c085D3A:#6CE9A6;--cECFDF3:#10291D;--cDCFAE6:#12301F;--cABEFC6:#1F5135;--c12B76A:#32D583;--cB42318:#F97066;--cFEE4E2:#3A1614;--cD92D20:#F04438;--c93370D:#FDB022;--c7A2E0E:#FEC84B;--cFEF0C7:#3A2A0A;--cFFFAEB:#2B2108;--cFEDF89:#5C4410;--cF79009:#F79009;--c6941C6:#BDB4FE;--cF4EBFF:#2A1F45;--c9E77ED:#9E77ED;--c3538CD:#A4BCFD;--cEEF4FF:#1C2547;--cEEF2FF:#1C2547;--c175CD3:#84CAFF;--cD1E9FF:#102A45;--c2E90FA:#53B1FD;--c026AA2:#7CD4FD;--cE0F2FE:#0B2A3D;--c0F766E:#5EEAD4;--c6D28D9:#C4B5FD;--accent:#8AB4FF;color-scheme:dark}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cFFFFFF:#181B21;--cF5F6F8:#0E1014;--cF9FAFB:#1D2128;--cF2F4F7:#252A32;--cF0F1F3:#262B33;--cE5E7EB:#2C323B;--cE4E7EC:#333A44;--cEEF0F3:#2A2F37;--cE9EBEF:#252A32;--cD0D5DD:#4A525E;--c98A2B3:#7C8695;--c667085:#949DAB;--c5B6170:#05060A;--c4B5563:#A7AFBB;--c374151:#D0D5DD;--c344054:#D0D5DD;--c111827:#F2F4F7;--c1D4ED8:#8AB4FF;--c1E3A8A:#B9D1FF;--c085D3A:#6CE9A6;--cECFDF3:#10291D;--cDCFAE6:#12301F;--cABEFC6:#1F5135;--c12B76A:#32D583;--cB42318:#F97066;--cFEE4E2:#3A1614;--cD92D20:#F04438;--c93370D:#FDB022;--c7A2E0E:#FEC84B;--cFEF0C7:#3A2A0A;--cFFFAEB:#2B2108;--cFEDF89:#5C4410;--cF79009:#F79009;--c6941C6:#BDB4FE;--cF4EBFF:#2A1F45;--c9E77ED:#9E77ED;--c3538CD:#A4BCFD;--cEEF4FF:#1C2547;--cEEF2FF:#1C2547;--c175CD3:#84CAFF;--cD1E9FF:#102A45;--c2E90FA:#53B1FD;--c026AA2:#7CD4FD;--cE0F2FE:#0B2A3D;--c0F766E:#5EEAD4;--c6D28D9:#C4B5FD;--accent:#8AB4FF;color-scheme:dark}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--cFFFFFF, #FFFFFF); font-family: 'Public Sans', system-ui, sans-serif; color: var(--c111827, #111827); overflow: hidden">
<header style="display: flex; align-items: center; gap: 4px; padding: 8px 16px 8px 4px; border-bottom: 1px solid var(--cE5E7EB, #E5E7EB)">
<a href="Category.dc.html" aria-label="Back to Groceries" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--c374151, #374151)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 19px; font-weight: 700">Target</h1><span style="font-size: 13px; color: var(--c4B5563, #4B5563)">Groceries</span></div>
</header>
<main style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px">
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--c374151, #374151)">What kind of target?</legend>
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
<button onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px; border-radius: 12px; border: 2px solid {{k.border}}; background: {{k.bg}}; text-align: left; font-family: inherit; color: var(--c111827, #111827)">
<span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; border: 2px solid {{k.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{k.dot}}"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{k.name}}</span><span style="font-size: 12px; color: var(--c4B5563, #4B5563)">{{k.desc}}</span></span>
</button>
</sc-for>
</fieldset>
<sc-if value="{{isRefill}}" hint-placeholder-val="{{ true }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--c374151, #374151)">Have this much available
<input value="600.00" inputmode="decimal" style="height: 44px; padding: 0 12px; border: 1px solid var(--cD0D5DD, #D0D5DD); border-radius: 10px; font-family: inherit; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums"></label>
<div role="group" aria-label="Every" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 10px; background: var(--cF2F4F7, #F2F4F7)">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
<button class="hit" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="height: 36px; border-radius: 8px; border: none; background: {{p.bg}}; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--c111827, #111827)">{{p.name}}</button>
</sc-for>
</div>
<sc-if value="{{longPeriod}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--c374151, #374151)">Due
<select style="height: 44px; padding: 0 12px; border: 1px solid var(--cD0D5DD, #D0D5DD); border-radius: 10px; font-family: inherit; font-size: 16px; background: var(--cFFFFFF, #FFFFFF)"><option>January 15</option><option>April 15</option></select></label>
</sc-if>
</sc-if>
<sc-if value="{{isAside}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--c374151, #374151)">Set aside every month
<input value="50.00" inputmode="decimal" style="height: 44px; padding: 0 12px; border: 1px solid var(--cD0D5DD, #D0D5DD); border-radius: 10px; font-family: inherit; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums"></label>
</sc-if>
<sc-if value="{{isByDate}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--c374151, #374151)">Reach a balance of
<input value="3,000.00" inputmode="decimal" style="height: 44px; padding: 0 12px; border: 1px solid var(--cD0D5DD, #D0D5DD); border-radius: 10px; font-family: inherit; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--c374151, #374151)">By
<input type="month" value="2027-06" style="height: 44px; padding: 0 12px; border: 1px solid var(--cD0D5DD, #D0D5DD); border-radius: 10px; font-family: inherit; font-size: 16px"></label>
</sc-if>
<sc-if value="{{isNoDate}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--c374151, #374151)">Reach a balance of
<input value="15,000.00" inputmode="decimal" style="height: 44px; padding: 0 12px; border: 1px solid var(--cD0D5DD, #D0D5DD); border-radius: 10px; font-family: inherit; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--c374151, #374151)">Add each month (optional)
<input value="500.00" inputmode="decimal" style="height: 44px; padding: 0 12px; border: 1px solid var(--cD0D5DD, #D0D5DD); border-radius: 10px; font-family: inherit; font-size: 18px; font-variant-numeric: tabular-nums"></label>
</sc-if>
<p style="margin: 0; padding: 12px; border-radius: 12px; background: var(--cF5F6F8, #F5F6F8); font-size: 14px; line-height: 1.45"><strong>{{needLine}}</strong><br>{{explain}}</p>
<sc-if value="{{askIdle}}" hint-placeholder-val="{{ true }}">
<button onClick="{{ask}}" style="align-self: flex-start; min-height: 36px; padding: 0; border: none; background: transparent; color: var(--cB42318, #B42318); font-family: inherit; font-size: 14px; font-weight: 700">Remove target</button>
</sc-if>
<sc-if value="{{asking}}" hint-placeholder-val="{{ false }}">
<div role="alertdialog" aria-label="Remove target" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--cFEE4E2, #FEE4E2); color: var(--cB42318, #B42318)">
<span style="font-size: 14px; line-height: 1.4">Remove the target from Groceries? The money stays in the category; it just stops showing as underfunded or low.</span>
<div style="display: flex; gap: 8px">
<button onClick="{{cancelAsk}}" style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid var(--cD0D5DD, #D0D5DD); background: var(--cFFFFFF, #FFFFFF); color: var(--c374151, #374151); font-family: inherit; font-size: 14px; font-weight: 700">Keep it</button>
<a href="Category.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; background: var(--cB42318, #B42318); color: var(--cFFFFFF, #FFFFFF); text-decoration: none; font-size: 14px; font-weight: 700">Remove target</a>
</div>
</div>
</sc-if>
</main>
<div style="padding: 12px 16px 24px; border-top: 1px solid var(--cE5E7EB, #E5E7EB)">
<a href="Category.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: {{accent}}; color: var(--cFFFFFF, #FFFFFF); text-decoration: none; font-size: 16px; font-weight: 700">Save target</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["app","light","dark"],"default":"app"},"accent":{"editor":"color","default":"#1D4ED8","options":["#1D4ED8","#0F766E","#6D28D9","#111827"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  llGetPref() { try { return localStorage.getItem('ledgerline-theme') || this.llMem || 'device'; } catch (e) { return this.llMem || 'device'; } }
  llSetPref(v) { this.llMem = v; try { localStorage.setItem('ledgerline-theme', v); } catch (e) {} this.llApply(); }
  llApply() {
    const forced = this.props.theme && this.props.theme !== 'app' ? this.props.theme : null;
    const p = forced || this.llGetPref();
    let dark = p === 'dark';
    if (p === 'device') { try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {} }
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const acc = { '#1D4ED8': '#8AB4FF', '#0F766E': '#5EEAD4', '#6D28D9': '#C4B5FD', '#111827': '#F2F4F7' };
    const a = String(this.props.accent || 'var(--c1D4ED8, #1D4ED8)').toUpperCase();
    if (a.charAt(0) === '#') { try { document.documentElement.style.setProperty('--accent', dark ? (acc[a] || '#8AB4FF') : a); } catch (e) {} }
  }
  componentDidMount() {
    this.llApply();
    this.llOn = () => { this.llApply(); this.forceUpdate(); };
    try { window.addEventListener('storage', this.llOn); this.llMq = window.matchMedia('(prefers-color-scheme: dark)'); this.llMq.addEventListener('change', this.llOn); } catch (e) {}
  }
  componentDidUpdate() { this.llApply(); }
  componentWillUnmount() { try { window.removeEventListener('storage', this.llOn); this.llMq.removeEventListener('change', this.llOn); } catch (e) {} }

  constructor(props) {
    super(props);
    this.state = { kind: 'refill', period: 'Month', asking: false };
  }
  renderVals() {
    const accent = ('var(--accent, ' + (this.props.accent ?? 'var(--c1D4ED8, #1D4ED8)') + ')');
    const kind = this.state.kind, period = this.state.period;
    const defs = [
      { id: 'refill', name: 'Refill', desc: 'Have an amount available each month, quarter or year; leftover rolls over' },
      { id: 'aside', name: 'Set aside', desc: 'Put the same amount in every month, whatever the balance' },
      { id: 'bydate', name: 'Balance by a date', desc: 'Reach a total by a month, in even steps' },
      { id: 'nodate', name: 'Balance, no date', desc: 'Grow toward a total, optionally a set amount each month' }
    ];
    const lines = {
      refill: period === 'Month' ? ['Needs $600 this month', 'You have $212.40 left, so next month needs $387.60 to refill.'] :
        period === 'Quarter' ? ['Needs $200 a month', '$600 per quarter in three monthly steps. Leftover lowers the next quarter.'] :
        ['Needs $50 a month', '$600 per year in twelve monthly steps. Leftover lowers next year.'],
      aside: ['Needs $50 every month', 'The balance keeps growing; spending doesn’t change what’s needed.'],
      bydate: ['Needs $250 a month', '$3,000 by June 2027 from what you have now, in even steps.'],
      nodate: ['Needs $500 a month', 'Shows progress toward $15,000; stops asking once reached.']
    };
    return {
      askIdle: !this.state.asking, asking: this.state.asking, ask: () => this.setState({ asking: true }), cancelAsk: () => this.setState({ asking: false }),
      accent: accent,
      kinds: defs.map((d) => {
        const on = d.id === kind;
        return { name: d.name, desc: d.desc, pressed: on ? 'true' : 'false', border: on ? accent : 'var(--cD0D5DD, #D0D5DD)', bg: on ? 'var(--cEEF2FF, #EEF2FF)' : 'var(--cFFFFFF, #FFFFFF)', dot: on ? accent : 'transparent', pick: () => this.setState({ kind: d.id }) };
      }),
      periods: ['Month', 'Quarter', 'Year'].map((p) => ({ name: p, pressed: p === period ? 'true' : 'false', bg: p === period ? 'var(--cFFFFFF, #FFFFFF)' : 'transparent', pick: () => this.setState({ period: p }) })),
      isRefill: kind === 'refill', isAside: kind === 'aside', isByDate: kind === 'bydate', isNoDate: kind === 'nodate',
      longPeriod: period !== 'Month',
      needLine: lines[kind][0],
      explain: lines[kind][1]
    };
  }
}
</script>
</body>
</html>
