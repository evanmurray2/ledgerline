name: nightly
on:
  schedule:
    - cron: '43 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e-sandbox:
    if: vars.SANDBOX_E2E == 'true'
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync a Plaid Sandbox Item through the Workflow on local wrangler dev
        run: node tools/ci/sandbox-e2e.mjs
        env:
          PLAID_CLIENT_ID: ${{ secrets.PLAID_SANDBOX_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SANDBOX_SECRET }}
