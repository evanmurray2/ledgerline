name: deploy
# Every merge to main (while the repository variable DEPLOY_ON_MERGE is true) → wait for this commit's ci run to pass
# (or skip, if a newer merge cancelled it: D-51) →
# deploy (each Durable Object migrates itself when it starts) → smoke test → rollback on failure. There is no manual
# trigger: merging to main is the only way to deploy (D-49). The only thing GitHub needs is the production
# environment's CLOUDFLARE_API_TOKEN; the Worker keeps the secrets it already has (docs/runbooks/setup.md, D-28).
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  ci-passed:
    # Only main deploys, and only a commit whose ci run passed (waits while it is still running).
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ON_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      # false when a newer merge cancelled this commit's ci: the newer deploy ships it (D-51).
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        run: node tools/ci/wait-for-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  production:
    needs: ci-passed
    if: needs.ci-passed.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      # Only for the build attestation step (docs/privacy.md 5.9): a signing identity for this run, and the right
      # to store the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ledgerline/web build
        env:
          # The same release id the Worker gets below: an open app that sees another one reloads.
          APP_VERSION: ${{ github.sha }}
      - name: The release's list of file hashes
        # One line per file of the web build, and one hash for all of it: anyone who builds this commit gets the
        # same list (docs/runbooks/verify-build.md). The app serves the same facts at /release.json.
        run: |
          mkdir "$RUNNER_TEMP/web-build"
          node tools/ci/build-hashes.mjs apps/web/dist --manifest "$RUNNER_TEMP/web-build/web-build-manifest.txt"
          cp apps/web/dist/release.json "$RUNNER_TEMP/web-build/release.json"
      - name: Secrets the Worker already has
        # Names only, never values. A Worker that doesn't exist yet (first deploy) has none.
        working-directory: apps/worker
        run: pnpm exec wrangler secret list --format json > "$RUNNER_TEMP/existing-secrets.json" || echo '[]' > "$RUNNER_TEMP/existing-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
      - name: Worker secrets
        run: node tools/ci/worker-secrets.mjs "$RUNNER_TEMP/secrets.json" "$RUNNER_TEMP/existing-secrets.json"
        env:
          ROTATE_TOKEN_KEYS: ${{ vars.ROTATE_TOKEN_KEYS }}
          APP_URL: ${{ vars.PRODUCTION_URL || 'https://ledgerline.ledger-line.workers.dev' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_REDIRECT_URI: ${{ secrets.PLAID_REDIRECT_URI }}
          TOKEN_KEYS: ${{ secrets.TOKEN_KEYS }}
          TOKEN_KEY_CURRENT: ${{ secrets.TOKEN_KEY_CURRENT }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      - name: Deploy production Worker
        working-directory: apps/worker
        # The commit is the app version: part of every screen's ETag, so a new release never reuses old responses.
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" --var "APP_VERSION:$APP_VERSION"
        env:
          APP_VERSION: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
      - name: Smoke test production
        id: smoke
        run: node tools/ci/smoke.mjs
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://ledgerline.ledger-line.workers.dev' }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
      # The two steps below run after the smoke test, so they never hold back or roll back a deploy: if one fails,
      # the release is live and the run shows as failed.
      - name: Keep the list with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-${{ github.sha }}
          path: ${{ runner.temp }}/web-build
          if-no-files-found: error
      - name: Attest the list of file hashes
        # GitHub signs "this run, from this commit, made this list" and keeps it in public (free for a public
        # repository; skipped on a private one, where it is not). The attested digest is the build hash.
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/web-build/web-build-manifest.txt
      - name: Roll back on failure
        if: failure() && steps.smoke.conclusion == 'failure'
        working-directory: apps/worker
        run: pnpm exec wrangler rollback --message "smoke test failed" -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
