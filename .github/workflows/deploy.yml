name: deploy
# Actions → deploy → Run workflow on main (or, once the repository variable DEPLOY_ON_MERGE is true, every merge to
# main) → wait for this commit's ci run to pass → deploy (each Durable Object migrates itself when it starts) → smoke
# test → rollback on failure. The only thing GitHub needs is the production environment's CLOUDFLARE_API_TOKEN; the
# Worker keeps the secrets it already has (docs/runbooks/setup.md, decisions.md D-28).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  ci-passed:
    # Only main deploys, and only a commit whose ci run passed (waits while it is still running).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_MERGE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node tools/ci/wait-for-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  production:
    needs: ci-passed
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ledgerline/web build
        env:
          # The same release id the Worker gets below: an open app that sees another one reloads.
          APP_VERSION: ${{ github.sha }}
      - name: Secrets the Worker already has
        # Names only, never values. A Worker that doesn't exist yet (first deploy) has none.
        working-directory: apps/worker
        run: pnpm exec wrangler secret list --format json > "$RUNNER_TEMP/existing-secrets.json" || echo '[]' > "$RUNNER_TEMP/existing-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
      - name: Worker secrets
        run: node tools/ci/worker-secrets.mjs "$RUNNER_TEMP/secrets.json" "$RUNNER_TEMP/existing-secrets.json"
        env:
          ROTATE_TOKEN_KEYS: ${{ vars.ROTATE_TOKEN_KEYS }}
          APP_URL: ${{ vars.PRODUCTION_URL || 'https://ledgerline.ledger-line.workers.dev' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_REDIRECT_URI: ${{ secrets.PLAID_REDIRECT_URI }}
          TOKEN_KEYS: ${{ secrets.TOKEN_KEYS }}
          TOKEN_KEY_CURRENT: ${{ secrets.TOKEN_KEY_CURRENT }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
      - name: Deploy production Worker
        working-directory: apps/worker
        # The commit is the app version: part of every screen's ETag, so a new release never reuses old responses.
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" --var "APP_VERSION:$APP_VERSION"
        env:
          APP_VERSION: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
      - name: Smoke test production
        id: smoke
        run: node tools/ci/smoke.mjs
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://ledgerline.ledger-line.workers.dev' }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
      - name: Roll back on failure
        if: failure() && steps.smoke.conclusion == 'failure'
        working-directory: apps/worker
        run: pnpm exec wrangler rollback --message "smoke test failed" -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
