name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    # How much of this run is needed (tools/ci/scope.mjs, D-84): everything, only `checks` for a docs-only change,
    # or nothing on `main` when these exact files already passed as a pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - id: scope
        run: node tools/ci/scope.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The record that this run tested these files; it counts once the run has passed.
      - if: steps.scope.outputs.marker != ''
        run: echo "$MARKER" > "$RUNNER_TEMP/ci-passed.txt"
        env:
          MARKER: ${{ steps.scope.outputs.marker }}
      - if: steps.scope.outputs.marker != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.scope.outputs.marker }}
          path: ${{ runner.temp }}/ci-passed.txt
          retention-days: 30
          overwrite: true
  checks:
    needs: scope
    if: needs.scope.outputs.run != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Unit tests (domain, provider, platform, web)
        run: pnpm test:unit
      - name: Build the SPA
        run: pnpm --filter @ledgerline/web build
      - name: Migration check
        run: node tools/ci/migration-check.mjs
      - name: Bundle size budget
        run: node tools/ci/bundle-budget.mjs
  integration:
    # The slowest part of the checks, so it runs beside them, in three parts.
    name: integration (${{ matrix.part }}/3)
    needs: scope
    if: needs.scope.outputs.run == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the SPA
        run: pnpm --filter @ledgerline/web build
      - name: Integration tests (Worker + Durable Objects in workerd), this part
        working-directory: apps/worker
        run: pnpm exec vitest run --shard="$PART/3"
        env:
          PART: ${{ matrix.part }}
      - name: Integration tests, the Durable Object and sign-up suites
        if: matrix.part == 3
        working-directory: apps/worker
        run: pnpm exec vitest run -c vitest.objects.config.ts && pnpm exec vitest run -c vitest.signup.config.ts
  e2e:
    # Runs beside the checks, in parts that each take about the same time: the mock-API suite and the real-Worker
    # suite in three parts each (Playwright --shard), and the two sign-in suites together.
    name: e2e (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: scope
    if: needs.scope.outputs.run == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: mock, shard: 1/3 }
          - { suite: mock, shard: 2/3 }
          - { suite: mock, shard: 3/3 }
          - { suite: worker, shard: 1/3 }
          - { suite: worker, shard: 2/3 }
          - { suite: worker, shard: 3/3 }
          - { suite: sign-in }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is cached per lockfile. The runner image already has the system libraries Chromium needs,
      # so a cached browser starts with no apt step.
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Playwright against the SPA with the mock API, phone and desktop
        if: matrix.suite == 'mock'
        working-directory: e2e
        run: pnpm exec playwright test --shard="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Build the SPA
        if: matrix.suite != 'mock'
        run: pnpm --filter @ledgerline/web build
      - name: Playwright against local wrangler dev with the November fixture
        if: matrix.suite == 'worker'
        working-directory: e2e
        run: pnpm exec playwright test -c playwright.worker.config.ts --shard="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Playwright against local wrangler dev, passkey sign-in, sign-up, then the move to the sealed log
        if: matrix.suite == 'sign-in'
        working-directory: e2e
        run: pnpm exec playwright test -c playwright.passkey.config.ts && pnpm exec playwright test -c playwright.signup.config.ts && pnpm exec playwright test -c playwright.move.config.ts
      # Also when a test only passed on its retry (e2e/retry-log.ts writes flaky-<suite>.md): the failed try's trace.
      - if: ${{ !cancelled() && (failure() || hashFiles('e2e/test-results/flaky-*.md') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.suite }}-${{ strategy.job-index }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
  e2e-passed:
    # The repository's merge rule asks for checks named `e2e (mock)` and `e2e (worker)`: these two report for all
    # the e2e parts above. A run that didn't need the e2e tests (scope) passes them.
    name: e2e (${{ matrix.suite }})
    needs: [scope, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        suite: [mock, worker]
    steps:
      - name: Every e2e part passed, or none was needed
        run: '[ "$E2E" = success ] || { [ "$E2E" = skipped ] && [ "$SCOPE" = success ] && [ "$RUN" != all ]; }'
        env:
          E2E: ${{ needs.e2e.result }}
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
