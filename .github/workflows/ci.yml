name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Unit tests (domain, provider, platform, web)
        run: pnpm test:unit
      - name: Build the SPA
        run: pnpm --filter @ledgerline/web build
      - name: Integration tests (Worker + Durable Objects in workerd)
        run: pnpm --filter @ledgerline/worker test
      - name: Migration check
        run: node tools/ci/migration-check.mjs
      - name: Bundle size budget
        run: node tools/ci/bundle-budget.mjs
  e2e:
    # Runs alongside checks, split in two so the slow mock-API suite and the real-Worker suites don't queue.
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [mock, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is cached per lockfile; the system libraries it needs come from apt each time.
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: e2e
      - name: Playwright against the SPA with the mock API, phone and desktop
        if: matrix.suite == 'mock'
        run: pnpm --filter @ledgerline/e2e test
      - name: Build the SPA
        if: matrix.suite == 'worker'
        run: pnpm --filter @ledgerline/web build
      - name: Playwright against local wrangler dev with the November fixture, then passkey sign-in
        if: matrix.suite == 'worker'
        run: pnpm --filter @ledgerline/e2e test:worker
      # Also when a test only passed on its retry (e2e/retry-log.ts writes flaky-<suite>.md): the failed try's trace.
      - if: ${{ !cancelled() && (failure() || hashFiles('e2e/test-results/flaky-*.md') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
