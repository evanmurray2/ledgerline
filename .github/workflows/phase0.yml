name: phase0
# Phase 0 of docs/multi-user.md: deploys a throwaway Worker (ledgerline-phase0, separate from the live app), runs the
# real app code inside a SQLite Durable Object, reads per-step CPU from Cloudflare's analytics, then deletes the
# Worker. Manual only (Actions → phase0 → Run workflow). Results: the run log and the phase0-results artifact.
on:
  workflow_dispatch:
    inputs:
      kinds:
        description: 'Plans to run (comma-separated): screens, screens-owner, sync, recompute, move'
        required: false
        default: 'screens,sync,recompute,move'
permissions:
  contents: read
concurrency:
  group: phase0
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Random key for the throwaway Worker
        id: key
        run: |
          k=$(openssl rand -hex 24)
          echo "::add-mask::$k"
          echo "key=$k" >> "$GITHUB_OUTPUT"
      - name: Deploy ledgerline-phase0 (not the live app)
        working-directory: apps/worker
        run: pnpm exec wrangler deploy -c phase0/wrangler.jsonc --var "PHASE0_KEY:$PHASE0_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PHASE0_KEY: ${{ steps.key.outputs.key }}
      - name: Measure
        working-directory: apps/worker
        run: node phase0/run.mjs
        env:
          BASE_URL: https://ledgerline-phase0.ledger-line.workers.dev
          PHASE0_KEY: ${{ steps.key.outputs.key }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'f2d39c71e2c0819833de7942cdcc1222' }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          KINDS: ${{ inputs.kinds }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phase0-results
          path: apps/worker/phase0-results.json
          if-no-files-found: warn
      - name: Delete ledgerline-phase0
        if: always()
        working-directory: apps/worker
        run: pnpm exec wrangler delete -c phase0/wrangler.jsonc --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
