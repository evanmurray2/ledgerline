name: keepalive
# GitHub disables scheduled workflows after 60 days without activity in public repos; a monthly commit prevents it.
on:
  schedule:
    - cron: '11 7 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD
